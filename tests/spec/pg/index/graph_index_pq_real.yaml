- statement: SET maintenance_work_mem = '2GB';
- statement: CREATE TABLE pq_t (id INTEGER, vec floatvector(8));
- statement: "INSERT INTO pq_t SELECT i,\n    ('[' || (i*0.01) || ',' || (i*0.02) || ',' || (i*0.03) || ',' || (i*0.04) || ','\n         || (i*0.05) || ',' || (i*0.06) || ',' || (i*0.07) || ',' || (i*0.08)\
    \ || ']')::floatvector\nFROM generate_series(0, 499) AS t(i);"
- statement: CREATE INDEX idx_plain ON pq_t USING vexdb_graph (vec);
- statement: CREATE INDEX idx_pq ON pq_t USING vexdb_graph (vec) WITH (quantizer = 'pq', pq_m = 4);
- query: SELECT use_pq FROM vexdb_index_info() WHERE indexname = 'idx_plain';
