name: graph_index_pq_disk_build
tags: [pg-only, pq, compact, disk-build, regression]
engines: [pg]
description: |
  maintenance_work_mem below 1GB starts the PG graph build directly on disk.
  PQ must remain active on that path instead of falling back to plain HNSW,
  and compact mode must store PQ codes without keeping a raw-vector mirror.
steps:
  - statement: SET maintenance_work_mem = '64MB';
  - statement: DROP FUNCTION IF EXISTS __pq_disk_vec32(int);
  - statement: |
      CREATE FUNCTION __pq_disk_vec32(i int) RETURNS floatvector
      LANGUAGE SQL IMMUTABLE STRICT AS $$
        SELECT array_agg(
          (sin(i * 0.013 + j * 0.17) +
           cos(i * 0.007 * (j + 1)) +
           ((i % 97) * (j + 1)) * 0.00001)::float4
          ORDER BY j
        )::floatvector
        FROM generate_series(0, 31) AS j
      $$;
  - statement: CREATE TABLE pq_disk (id int PRIMARY KEY, vec floatvector(32));
  - statement: |
      INSERT INTO pq_disk
      SELECT i, __pq_disk_vec32(i)
      FROM generate_series(1, 2048) AS i;

  - statement: |
      CREATE INDEX idx_pq_disk_full
      ON pq_disk USING vexdb_graph (vec floatvector_l2_ops)
      WITH (quantizer=pq, pq_m=8, memory_mode=full,
            m=16, ef_construction=100, parallel_workers=0);
  - query: |
      SELECT memory_mode, quantizer, use_pq,
             pq_codes_bytes > 0, pq_codebook_bytes > 0
      FROM vexdb_index_info() WHERE indexname='idx_pq_disk_full';
    expect: [[full, pq, t, t, t]]
  - query: |
      SELECT count(*) FROM (
        SELECT id FROM pq_disk
        ORDER BY vec <-> __pq_disk_vec32(777) LIMIT 10
      ) AS ann;
    expect: [[10]]
  - statement: DROP INDEX idx_pq_disk_full;

  - statement: |
      CREATE INDEX idx_pq_disk_compact
      ON pq_disk USING vexdb_graph (vec floatvector_l2_ops)
      WITH (quantizer=pq, pq_m=8, memory_mode=compact,
            m=16, ef_construction=100, parallel_workers=0);
  - query: |
      SELECT memory_mode, quantizer, use_pq,
             pq_codes_bytes > 0, pq_codebook_bytes > 0
      FROM vexdb_index_info() WHERE indexname='idx_pq_disk_compact';
    expect: [[compact, pq, t, t, t]]
  - query: |
      SELECT content::text FROM index_inspect('idx_pq_disk_compact')
      WHERE attribute = 'Vector Storage';
    expect: [["PQ Code"]]
  - statement: CHECKPOINT;
  - raw_directive: restart
  - statement: SET enable_seqscan = off;
  - query: |
      SELECT count(*) FROM (
        SELECT id FROM pq_disk
        ORDER BY vec <-> __pq_disk_vec32(777) LIMIT 10
      ) AS ann;
    expect: [[10]]
  - statement: SET enable_seqscan = on;
  - statement: DROP TABLE pq_disk;
  - statement: DROP FUNCTION __pq_disk_vec32(int);
