# auto-migrated from sqllogictest; review before relying on it
# 1. setup/teardown 未自动切分, 全在 steps; 必要时人工重组
# 2. 变量反向替换仅做高置信度模式 (FLOAT[N]/GRAPH_INDEX/距离函数)
# 3. 复杂指令 (loop/onlyif/skipif) 保留为 raw_directive
name: functions__distance_operators
tags:
- vex
- migrated
engines:
- duckdb
- pg
- opengauss
description: Test distance operators <->, <=>, <~> with FLOAT[N]
steps:
- query: SELECT ${VEC_LITERAL([1.0, 0.0, 0.0], 3)} <-> ${VEC_LITERAL([0.0, 1.0, 0.0], 3)};
  _field_types: R
  expect:
  - - 1.4142135
- query: SELECT ${VEC_LITERAL([1.0, 0.0], 2)} <=> ${VEC_LITERAL([0.0, 1.0], 2)};
  _field_types: R
  expect:
  - - 1.0
- query: SELECT ${VEC_LITERAL([1.0, 2.0], 2)} <=> ${VEC_LITERAL([2.0, 4.0], 2)};
  _field_types: R
  expect:
  - - 0.0
- query: SELECT array_inner_product(${VEC_LITERAL([1.0, 2.0, 3.0], 3)}, ${VEC_LITERAL([4.0, 5.0, 6.0], 3)});
  _field_types: R
  expect:
  - - 32.0
- query: SELECT array_cosine_similarity(${VEC_LITERAL([1.0, 0.0], 2)}, ${VEC_LITERAL([1.0, 0.0], 2)});
  _field_types: R
  expect:
  - - 1.0
- statement: CREATE TABLE items (id INT, v ${VECTOR(3)});
- statement: "INSERT INTO items VALUES\n  (1, ${VEC_LITERAL([1.0, 0.0, 0.0], 3)}),\n  (2, ${VEC_LITERAL([0.0, 1.0, 0.0], 3)}),\n  (3, ${VEC_LITERAL([0.5, 0.5, 0.0], 3)});"
- query: SELECT id FROM items ORDER BY v <-> ${VEC_LITERAL([1.0, 0.0, 0.0], 3)} LIMIT 2;
  _field_types: I
  expect:
  - - 1
  - - 3
- query: SELECT id FROM items ORDER BY v <=> ${VEC_LITERAL([1.0, 0.0, 0.0], 3)} LIMIT 2;
  _field_types: I
  expect:
  - - 1
  - - 3
- query: SELECT ${VEC_LITERAL([1.0, 2.0], 2)} <~> ${VEC_LITERAL([3.0, 4.0], 2)};
  _field_types: R
  expect:
  - - -11.0
- query: SELECT id FROM items ORDER BY v <~> ${VEC_LITERAL([1.0, 0.0, 0.0], 3)} LIMIT 2;
  _field_types: I
  expect:
  - - 1
  - - 3
- query: SELECT array_negative_inner_product(${VEC_LITERAL([1.0, 2.0], 2)}, ${VEC_LITERAL([3.0, 4.0], 2)});
  _field_types: R
  expect:
  - - -11.0
- query: SELECT ${VEC_LITERAL([1.0, 0.0, 0.0], 3)} <-> '[0.0, 1.0, 0.0]';
  _field_types: R
  expect:
  - - 1.4142135
- query: SELECT ${VEC_LITERAL([1.0, 0.0], 2)} <=> '[0.0, 1.0]';
  _field_types: R
  expect:
  - - 1.0
- query: SELECT ${VEC_LITERAL([1.0, 2.0], 2)} <~> '[3.0, 4.0]';
  _field_types: R
  expect:
  - - -11.0
- query: SELECT '[1.0, 0.0]' <-> '[0.0, 1.0]';
  _field_types: R
  expect:
  - - 1.4142135
