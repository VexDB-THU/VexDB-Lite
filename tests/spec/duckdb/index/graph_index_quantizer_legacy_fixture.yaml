name: duckdb_graph_index_quantizer_legacy_fixture
tags: [duckdb, quantizer, persistence, backward_compatibility, regression]
engines: [duckdb]
description: Current code opens and mutates fixed PQ v1 and RaBitQ v2 files generated by an older extension.
steps:
  - raw_directive: unzip test/fixtures/duckdb_quantizer_legacy_v1_v2.db.gz __TEST_DIR__/duckdb_quantizer_legacy_v1_v2.db
  - statement: ATTACH '__TEST_DIR__/duckdb_quantizer_legacy_v1_v2.db' AS legacy;
  - statement: SET ${GUC_BF_THRESHOLD} = 0;
  - statement: SET ${GUC_PQ_SEARCH_MODE} = 'pq_only';
  - query: "EXPLAIN SELECT id FROM legacy.legacy_pq
      ORDER BY ${L2(vec, ${VEC_LITERAL([0,1,0,1,0,1,0,1], 8)})} LIMIT 10;"
    _field_types: II
    expect:
      - [physical_plan, <REGEX>:.*VEXDB_INDEX_SCAN.*]
  - query: "SELECT count(*), count(DISTINCT id) FROM (
      SELECT id FROM legacy.legacy_pq
      ORDER BY ${L2(vec, ${VEC_LITERAL([0,1,0,1,0,1,0,1], 8)})} LIMIT 512);"
    _field_types: II
    expect:
      - [512, 512]
  - statement: "UPDATE legacy.legacy_pq SET vec = ${VEC_LITERAL([100,100,100,100,100,100,100,100], 8)} WHERE id = 0;"
  - query: "SELECT count(*), count(DISTINCT id) FROM (
      SELECT id FROM legacy.legacy_pq
      ORDER BY ${L2(vec, ${VEC_LITERAL([0,1,0,1,0,1,0,1], 8)})} LIMIT 512);"
    _field_types: II
    expect:
      - [512, 512]
  - statement: RESET ${GUC_PQ_SEARCH_MODE};

  - query: "EXPLAIN SELECT id FROM legacy.legacy_rq
      ORDER BY ${L2(vec, ${VEC_LITERAL([0,1,0,1,0,1,0,1], 8)})} LIMIT 10;"
    _field_types: II
    expect:
      - [physical_plan, <REGEX>:.*VEXDB_INDEX_SCAN.*]
  - query: "SELECT count(*), count(DISTINCT id) FROM (
      SELECT id FROM legacy.legacy_rq
      ORDER BY ${L2(vec, ${VEC_LITERAL([0,1,0,1,0,1,0,1], 8)})} LIMIT 512);"
    _field_types: II
    expect:
      - [512, 512]
  - statement: "UPDATE legacy.legacy_rq SET vec = ${VEC_LITERAL([-100,-100,-100,-100,-100,-100,-100,-100], 8)} WHERE id = 1;"
  - statement: CHECKPOINT;
  - statement: DETACH legacy;
  - statement: ATTACH '__TEST_DIR__/duckdb_quantizer_legacy_v1_v2.db' AS legacy;
  - statement: SET ${GUC_BF_THRESHOLD} = 0;
  - statement: SET ${GUC_PQ_SEARCH_MODE} = 'pq_only';
  - query: "SELECT count(*), count(DISTINCT id) FROM (
      SELECT id FROM legacy.legacy_pq
      ORDER BY ${L2(vec, ${VEC_LITERAL([0,1,0,1,0,1,0,1], 8)})} LIMIT 512);"
    _field_types: II
    expect:
      - [512, 512]
  - statement: RESET ${GUC_PQ_SEARCH_MODE};
  - query: "SELECT count(*), count(DISTINCT id) FROM (
      SELECT id FROM legacy.legacy_rq
      ORDER BY ${L2(vec, ${VEC_LITERAL([0,1,0,1,0,1,0,1], 8)})} LIMIT 512);"
    _field_types: II
    expect:
      - [512, 512]
