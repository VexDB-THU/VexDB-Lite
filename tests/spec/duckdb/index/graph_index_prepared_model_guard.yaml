- statement: SET ${GUC_PQ_SEARCH_MODE}='pq_only';
- statement: PREPARE prepared_rabitq_compact_query AS SELECT id FROM prepared_rabitq_compact ORDER BY ${L2(vec, ${VEC_LITERAL([0,0,0,0,0,0,0,0], 8)})} LIMIT 1;
- statement: EXECUTE prepared_rabitq_compact_query;
- query: EXPLAIN EXECUTE prepared_rabitq_compact_query;
  _field_types: II
  expect:
  - - physical_plan
