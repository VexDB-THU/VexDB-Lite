- statement: UPDATE prepared_rabitq_compact SET vec=${VEC_LITERAL([100,0,0,0,0,0,0,0], 8)} WHERE id=0;
- statement: UPDATE prepared_rabitq_compact SET vec=${VEC_LITERAL([-100,0,0,0,0,0,0,0], 8)} WHERE id=1;
- query: EXECUTE prepared_rabitq_compact_query;
  _field_types: I
  expect:
  - - 2
- statement: BEGIN;
- statement: UPDATE prepared_rabitq_compact SET vec=${VEC_LITERAL([500,0,0,0,0,0,0,0], 8)} WHERE id=2;
- query: EXECUTE prepared_rabitq_compact_query;
  _field_types: I
  expect:
  - - 3
- statement: ROLLBACK;
- query: EXECUTE prepared_rabitq_compact_query;
  _field_types: I
  expect:
  - - 2
- statement: BEGIN;
- statement: INSERT INTO prepared_rabitq_compact VALUES(999,${VEC_LITERAL([.0001,0,0,0,0,0,0,0], 8)});
- query: EXECUTE prepared_rabitq_compact_query;
  _field_types: I
  expect:
  - - 999
- statement: ROLLBACK;
