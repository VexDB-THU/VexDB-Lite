- query: EXPLAIN EXECUTE prepared_rabitq_full_query;
  _field_types: II
  expect:
  - - physical_plan
    - <REGEX>:.*VEXDB_INDEX_SCAN.*
- statement: UPDATE prepared_rabitq_full SET vec=${VEC_LITERAL([100,0,0,0,0,0,0,0], 8)} WHERE id=0;
- statement: UPDATE prepared_rabitq_full SET vec=${VEC_LITERAL([-100,0,0,0,0,0,0,0], 8)} WHERE id=1;
- query: EXECUTE prepared_rabitq_full_query;
  _field_types: I
  expect:
  - - 2
- statement: BEGIN;
- statement: UPDATE prepared_rabitq_full SET vec=${VEC_LITERAL([500,0,0,0,0,0,0,0], 8)} WHERE id=2;
- query: EXECUTE prepared_rabitq_full_query;
  _field_types: I
  expect:
  - - 3
- statement: ROLLBACK;
- query: EXECUTE prepared_rabitq_full_query;
  _field_types: I
  expect:
  - - 2
- statement: BEGIN;
- statement: INSERT INTO prepared_rabitq_full VALUES(999,${VEC_LITERAL([.0001,0,0,0,0,0,0,0], 8)});
- query: EXECUTE prepared_rabitq_full_query;
  _field_types: I
  expect:
