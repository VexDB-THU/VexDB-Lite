name: sqlite__vexfs_workspace_log
tags: [vexfs, sqlite, workspace, log, pagination]
description: SQLite VexFS workspace 日志按 commit 分页并关联命名快照
steps:
- query: SELECT vexfs_init();
  expect:
  - - 1
- query: SELECT vexfs_workspace_create('workspace-log');
  expect:
  - - 1
- query: SELECT vexfs_mkdir('workspace-log', '/src');
  expect:
  - - 2
- query: SELECT vexfs_write('workspace-log', '/src/main.txt', 'one');
  expect:
  - - 1
- query: SELECT vexfs_snapshot_create('workspace-log', 'baseline');
  expect:
  - - 3
- query: SELECT vexfs_write('workspace-log', '/src/main.txt', 'two');
  expect:
  - - 2
- query: SELECT json_extract(vexfs_workspace_log('workspace-log', 2, 0), '$.entries[0].commit'), json_extract(vexfs_workspace_log('workspace-log', 2, 0), '$.entries[0].parent_commit'), json_extract(vexfs_workspace_log('workspace-log', 2, 0), '$.entries[0].operation'), json_extract(vexfs_workspace_log('workspace-log', 2, 0), '$.entries[0].path'), json_extract(vexfs_workspace_log('workspace-log', 2, 0), '$.entries[0].actor'), json_extract(vexfs_workspace_log('workspace-log', 2, 0), '$.entries[0].has_snapshot'), json_extract(vexfs_workspace_log('workspace-log', 2, 0), '$.next_before');
  expect:
  - - 4
    - 3
    - write file
    - /src/main.txt
    - local
    - 0
    - 3
- query: SELECT json_extract(vexfs_workspace_log('workspace-log', 2, 0), '$.entries[1].commit'), json_extract(vexfs_workspace_log('workspace-log', 2, 0), '$.entries[1].has_snapshot'), json_extract(vexfs_workspace_log('workspace-log', 2, 0), '$.entries[1].snapshots[0]');
  expect:
  - - 3
    - 1
    - baseline
- query: SELECT json_extract(vexfs_workspace_log('workspace-log', 2, NULL), '$.entries[0].commit');
  expect:
  - - 4
- query: SELECT json_extract(vexfs_workspace_log('workspace-log', 2, 3), '$.entries[0].commit'), json_extract(vexfs_workspace_log('workspace-log', 2, 3), '$.entries[1].commit'), json_type(vexfs_workspace_log('workspace-log', 2, 3), '$.next_before');
  expect:
  - - 2
    - 1
    - 'null'
- query: SELECT vexfs_workspace_log('workspace-log', 0, 0);
  expect_error: positive integer
