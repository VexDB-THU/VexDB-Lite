[package]
name = "vexfs-nfs-gateway"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
async-trait = "0.1.91"
libc = "0.2.189"
nfsserve = { path = "vendor/nfsserve" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
