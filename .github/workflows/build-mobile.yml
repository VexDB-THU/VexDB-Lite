name: Build SQLite Android Libraries

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-dev
          python -m pip install 'cmake>=3.28,<4'
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27
      - name: Prepare SQLite and Boost headers
        run: |
          bash build_sqlite.sh vendor
          mkdir -p build/android-deps/include
          cp -a /usr/include/boost build/android-deps/include/
      - name: Build SQLite extension and static library
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_ABI: ${{ matrix.abi }}
        run: |
          cmake -S vexdb_sqlite -B "build/android/$ANDROID_ABI" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI="$ANDROID_ABI" -DANDROID_PLATFORM=android-24 \
            -DCMAKE_BUILD_TYPE=Release \
            -DVEXDB_BOOST_INC="$PWD/build/android-deps/include" \
            -DVEXFS_ENABLE_POSTGRESQL=OFF -DVEXDB_SQLITE_BUILD_TESTS=OFF
          cmake --build "build/android/$ANDROID_ABI" \
            --target vexdb_lite_loadable vexdb_lite_static --parallel 2
      - name: Package libraries
        env:
          ANDROID_ABI: ${{ matrix.abi }}
        run: |
          mkdir -p "dist/android/$ANDROID_ABI"
          cp "build/android/$ANDROID_ABI/vexdb_lite.so" \
            "build/android/$ANDROID_ABI/libvexdb_lite_static.a" \
            vexdb_sqlite/include/vexdb_sqlite.h "dist/android/$ANDROID_ABI/"
      - uses: actions/upload-artifact@v4
        with:
          name: sqlite-android-${{ matrix.abi }}
          path: dist/android/${{ matrix.abi }}/
          if-no-files-found: error
