name: Build & Test Linux

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    uses: ./.github/workflows/_linux-tests.yml
    with:
      runner: ${{ matrix.runner }}
      arch: ${{ matrix.arch }}
