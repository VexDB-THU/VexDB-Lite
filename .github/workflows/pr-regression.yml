name: PR regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -color
      - name: Render all spec targets
        run: |
          python -m pip install -r tests/spec/requirements.txt
          python tests/spec/_lib/render.py --engine all --out build/spec
      - name: Test Community checkout entry
        run: bash tests/community/test_makefile_checkout.sh
      - name: Check graph connectivity repair
        run: bash vexdb_duckdb/test/run_graph_connectivity_test.sh

  linux:
    needs: validate
    uses: ./.github/workflows/_linux-tests.yml
    with:
      test_pg: true
