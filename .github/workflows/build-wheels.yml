name: Build Python Wheels

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version'
        required: false
        default: '3.12'
        type: choice
        options: ['3.10', '3.11', '3.12', '3.13']
  push:
    tags:
      - 'v*'

env:
  PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - os: macos-14
            name: macOS-arm64
          # macOS Intel
          - os: macos-13
            name: macOS-x86_64
          # Linux x86_64
          - os: ubuntu-22.04
            name: Linux-x86_64
          # Linux ARM64
          - os: ubuntu-22.04-arm
            name: Linux-aarch64
          # Windows
          - os: windows-2022
            name: Windows-AMD64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: pip install scikit-build-core pybind11 setuptools_scm ninja wheel

      # ── Build ──
      - name: Build wheel (Unix)
        if: runner.os != 'Windows'
        run: bash packaging/build_wheel.sh dist

      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash packaging/build_wheel_windows.sh dist

      # ── Smoke test ──
      - name: Smoke test
        shell: bash
        run: |
          pip install dist/*.whl --force-reinstall --no-deps
          python -c "
          import duckdb
          con = duckdb.connect()
          print(f'DuckDB {duckdb.__version__}')

          # VEX extension loaded
          r = con.execute(\"SELECT loaded FROM duckdb_extensions() WHERE extension_name='vex'\").fetchone()
          assert r and r[0], 'VEX extension not loaded!'
          print('VEX extension: loaded')

          # Distance function
          r = con.execute(\"SELECT l2_distance([1,0,0]::FLOAT[3], [0,1,0]::FLOAT[3])\").fetchone()
          assert abs(r[0] - 1.4142135623730951) < 1e-6
          print(f'l2_distance: OK')

          # HNSW index + ANN search
          con.execute('CREATE TABLE t (id INT, v FLOAT[3])')
          con.execute(\"INSERT INTO t VALUES (1,[1,0,0]),(2,[0,1,0]),(3,[0,0,1])\")
          con.execute(\"CREATE INDEX idx ON t USING GRAPH_INDEX (v) WITH (metric='l2')\")
          r = con.execute(\"SELECT id FROM t ORDER BY l2_distance(v,[1,0,0]::FLOAT[3]) LIMIT 1\").fetchone()
          assert r[0] == 1
          print('GRAPH_INDEX + ANN: OK')

          print('All smoke tests passed!')
          "

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}-py${{ env.PYTHON_VERSION }}
          path: dist/*.whl

  # ── Collect all wheels ──
  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: all-wheels
          pattern: wheel-*
          merge-multiple: true

      - name: List wheels
        run: ls -lh all-wheels/

      - name: Upload combined
        uses: actions/upload-artifact@v4
        with:
          name: vexdb-lite-wheels
          path: all-wheels/*.whl

  # ── GitHub Release (tag push only) ──
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: vexdb-lite-wheels
          path: wheels

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheels/*.whl
          generate_release_notes: true
