name: Build Python Wheels

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: 'Python version'
        required: false
        default: '3.12'
        type: choice
        options: ['3.10', '3.11', '3.12', '3.13']
  push:
    tags:
      - 'v*'

env:
  PYTHON_VERSION: ${{ inputs.python_version || '3.12' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS-arm64
          - os: ubuntu-latest
            name: Linux-x86_64
          - os: ubuntu-latest
            name: Linux-aarch64
            arch: aarch64
          - os: windows-latest
            name: Windows-AMD64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── Linux aarch64: cross-compile via Docker + QEMU ──
      - name: Set up QEMU
        if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build and test (Linux aarch64)
        if: matrix.arch == 'aarch64'
        run: |
          docker run --rm --platform linux/arm64 \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            python:${{ env.PYTHON_VERSION }}-bookworm \
            bash -c "pip install scikit-build-core pybind11 setuptools_scm ninja wheel && bash packaging/build_wheel.sh dist && pip install dist/*.whl --force-reinstall --no-deps && python packaging/smoke_test.py"

      # ── Native builds ──
      - name: Set up Python
        if: matrix.arch != 'aarch64'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        if: matrix.arch != 'aarch64'
        run: pip install scikit-build-core pybind11 setuptools_scm ninja wheel

      - name: Build wheel (Unix)
        if: runner.os != 'Windows' && matrix.arch != 'aarch64'
        run: bash packaging/build_wheel.sh dist

      - name: Build wheel (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: bash packaging/build_wheel_windows.sh dist

      - name: Smoke test
        if: matrix.arch != 'aarch64'
        shell: bash
        run: |
          pip install dist/*.whl --force-reinstall --no-deps
          python packaging/smoke_test.py

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.name }}-py${{ env.PYTHON_VERSION }}
          path: dist/*.whl

  collect:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: all-wheels
          pattern: wheel-*
          merge-multiple: true

      - name: List wheels
        run: ls -lh all-wheels/

      - name: Upload combined
        uses: actions/upload-artifact@v4
        with:
          name: vexdb-lite-wheels
          path: all-wheels/*.whl

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v4
        with:
          name: vexdb-lite-wheels
          path: wheels

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: wheels/*.whl
          generate_release_notes: true
